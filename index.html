<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Змейка с порталами</title>
<style>
  :root {
    --bg: #0d0f1a;
    --panel: #161a2b;
    --grid: #1b2036;
    --text: #e8ebff;
    --muted: #8a90b5;
    --snake: #5cf2a5;
    --snake-dark: #1f9e6a;
    --food: #ff5c7a;
    --gold: #ffd25c;
    --portal-a: #5ca8ff;
    --portal-b: #ff9b3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; gap: 12px;
    user-select: none;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  h1 span { color: var(--portal-a); }
  h1 em { color: var(--portal-b); font-style: normal; }
  .hud {
    width: min(92vw, 560px);
    display: flex; justify-content: space-between;
    font-size: 15px; color: var(--muted);
  }
  .hud b { color: var(--text); font-size: 18px; margin-left: 4px; }
  .wrap { position: relative; width: min(92vw, 560px, calc(100vh - 170px)); aspect-ratio: 1; }
  canvas {
    width: 100%; height: 100%; display: block;
    border-radius: 12px; background: var(--panel);
    box-shadow: 0 0 0 2px #262c48, 0 20px 60px #0008;
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: #0d0f1acc; border-radius: 12px; gap: 10px; padding: 20px;
    cursor: pointer;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 28px; }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 340px; }
  .btn {
    margin-top: 6px; padding: 10px 22px; border-radius: 999px; border: 0;
    background: var(--snake); color: #08130d; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .help { font-size: 13px; color: var(--muted); text-align: center; }
  kbd { background: #262c48; border-radius: 4px; padding: 1px 6px; color: var(--text); }
</style>
</head>
<body>
  <h1>🐍 Змейка с <span>пор</span><em>талами</em></h1>
  <div class="hud">
    <div>Счёт:<b id="score">0</b></div>
    <div>Рекорд:<b id="best">0</b></div>
  </div>
  <div class="wrap">
    <canvas id="c"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Змейка с порталами</h2>
      <p id="ovText">Ныряй в <span style="color:var(--portal-a)">синий</span> портал и выныривай из <span style="color:var(--portal-b)">оранжевого</span> (и наоборот).<br>
        🍎 — +1. ⭐ — +3, но звезда убегает!</p>
      <button class="btn" id="ovBtn">Играть</button>
    </div>
  </div>
  <div class="help"><kbd>←↑↓→</kbd> / <kbd>WASD</kbd> — движение · <kbd>Пробел</kbd> — пауза · <kbd>R</kbd> — заново · на телефоне — свайпы</div>

<script>
const N = 22;                       // клеток по стороне
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {
  grid: css('--grid'), snake: css('--snake'), snakeDark: css('--snake-dark'),
  food: css('--food'), gold: css('--gold'), a: css('--portal-a'), b: css('--portal-b')
};

let snake, dir, queue, food, bonus, portals, score, eaten, grow, speed, state, particles;
let best = 0;
try { best = +localStorage.getItem('snakePortalsBest') || 0; } catch (e) {}
$('best').textContent = best;

const DIRS = {
  ArrowUp: [0,-1], KeyW: [0,-1], ArrowDown: [0,1], KeyS: [0,1],
  ArrowLeft: [-1,0], KeyA: [-1,0], ArrowRight: [1,0], KeyD: [1,0]
};
const eq = (p, q) => p && q && p[0] === q[0] && p[1] === q[1];
const inside = p => p[0] >= 0 && p[1] >= 0 && p[0] < N && p[1] < N;
const rnd = n => Math.floor(Math.random() * n);

function occupied(p) {
  return snake.some(s => eq(s, p)) || eq(food, p) || (bonus && eq(bonus.pos, p)) ||
         (portals && portals.some(q => eq(q, p)));
}
function freeCell(margin = 0) {
  for (let i = 0; i < 1000; i++) {
    const p = [margin + rnd(N - 2 * margin), margin + rnd(N - 2 * margin)];
    if (!occupied(p)) return p;
  }
  return null;
}
function placePortals() {
  portals = null;
  // порталы не у стены и не слишком близко друг к другу и к голове
  let a, b, tries = 0;
  do {
    a = freeCell(2); b = freeCell(2); tries++;
  } while (tries < 200 && (Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) < 8 ||
           Math.abs(a[0]-snake[0][0]) + Math.abs(a[1]-snake[0][1]) < 3));
  portals = [a, b];
}

function reset() {
  const m = Math.floor(N / 2);
  snake = [[m-6, m], [m-7, m], [m-8, m]];
  dir = [1, 0]; queue = [];
  score = 0; eaten = 0; grow = 0; speed = 140;
  bonus = null; particles = []; food = null; portals = null;
  placePortals();
  food = freeCell();
  $('score').textContent = 0;
}

function burst(p, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 0.04 + Math.random() * 0.12;
    particles.push({ x: p[0] + .5, y: p[1] + .5, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color });
  }
}

function gameOver() {
  state = 'over';
  if (score > best) {
    best = score; $('best').textContent = best;
    try { localStorage.setItem('snakePortalsBest', best); } catch (e) {}
  }
  showOverlay('Игра окончена', `Счёт: ${score}${score === best && score > 0 ? ' — новый рекорд! 🏆' : ''}`, 'Ещё раз');
}

function step() {
  if (queue.length) dir = queue.shift();
  let head = [snake[0][0] + dir[0], snake[0][1] + dir[1]];

  // телепорт: выныриваем на клетку за парным порталом
  const pi = portals.findIndex(p => eq(p, head));
  if (pi >= 0) {
    const out = portals[1 - pi];
    burst(head, pi ? C.b : C.a, 8);
    head = [out[0] + dir[0], out[1] + dir[1]];
    burst(out, pi ? C.a : C.b, 8);
  }

  if (!inside(head)) return gameOver();
  const body = grow > 0 ? snake : snake.slice(0, -1);
  if (body.some(s => eq(s, head))) return gameOver();

  snake.unshift(head);

  if (eq(head, food)) {
    score += 1; eaten += 1; grow += 1;
    speed = Math.max(65, speed - 3);
    burst(head, C.food);
    if (eaten % 5 === 0) placePortals();          // порталы переезжают
    food = freeCell();
    if (!bonus && Math.random() < 0.3) bonus = { pos: freeCell(1), life: 70, t: 0 };
  }
  if (bonus && eq(head, bonus.pos)) {
    score += 3; grow += 3;
    burst(head, C.gold, 24);
    bonus = null;
  }

  if (grow > 0) grow--; else snake.pop();
  $('score').textContent = score;

  // звезда-беглянка
  if (bonus) {
    bonus.life--; bonus.t++;
    if (bonus.life <= 0) { burst(bonus.pos, C.gold, 6); bonus = null; }
    else if (bonus.t % 2 === 0) {
      const d = p => Math.abs(p[0] - head[0]) + Math.abs(p[1] - head[1]);
      if (d(bonus.pos) <= 5) {
        const cur = bonus.pos;
        bonus.pos = null; // чтобы occupied() не считал её саму
        const opts = [[1,0],[-1,0],[0,1],[0,-1]]
          .map(v => [cur[0] + v[0], cur[1] + v[1]])
          .filter(p => inside(p) && !occupied(p))
          .sort((p, q) => d(q) - d(p));
        bonus.pos = opts.length && d(opts[0]) > d(cur) ? opts[0] : cur;
      }
    }
  }
}

// ---------- отрисовка ----------
let cell = 20;
function resize() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  cell = canvas.width / N;
}
window.addEventListener('resize', resize);

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
  ctx.fill();
}

function draw(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // шахматная сетка
  ctx.fillStyle = C.grid;
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++)
    if ((x + y) % 2) ctx.fillRect(x * cell, y * cell, cell, cell);

  // порталы
  portals.forEach((p, i) => {
    const cx = (p[0] + .5) * cell, cy = (p[1] + .5) * cell;
    const color = i ? C.b : C.a;
    for (let k = 0; k < 3; k++) {
      const rot = time / 400 * (i ? -1 : 1) + k * 2.1;
      ctx.strokeStyle = color; ctx.globalAlpha = 1 - k * 0.28;
      ctx.lineWidth = cell * 0.1;
      ctx.beginPath();
      ctx.arc(cx, cy, cell * (0.45 - k * 0.12), rot, rot + Math.PI * 1.3);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = cell * 0.8;
    ctx.beginPath(); ctx.arc(cx, cy, cell * 0.1, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
  });

  // еда
  const pulse = 1 + Math.sin(time / 180) * 0.08;
  ctx.fillStyle = C.food; ctx.shadowColor = C.food; ctx.shadowBlur = cell * 0.5;
  ctx.beginPath();
  ctx.arc((food[0] + .5) * cell, (food[1] + .5) * cell, cell * 0.33 * pulse, 0, 7);
  ctx.fill(); ctx.shadowBlur = 0;

  // звезда
  if (bonus) {
    const cx = (bonus.pos[0] + .5) * cell, cy = (bonus.pos[1] + .5) * cell;
    const blink = bonus.life < 20 && Math.floor(time / 120) % 2;
    if (!blink) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(time / 600);
      ctx.fillStyle = C.gold; ctx.shadowColor = C.gold; ctx.shadowBlur = cell * 0.7;
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const r = (k % 2 ? 0.18 : 0.42) * cell, a = k * Math.PI / 5;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }

  // змейка (от хвоста к голове — голова сверху)
  for (let i = snake.length - 1; i >= 0; i--) {
    const [x, y] = snake[i];
    const t = i / Math.max(1, snake.length - 1);
    ctx.fillStyle = i === 0 ? C.snake : mix(C.snake, C.snakeDark, t);
    const pad = i === 0 ? cell * 0.04 : cell * (0.08 + t * 0.06);
    roundRect(x * cell + pad, y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.3);
  }
  // глаза
  const [hx, hy] = snake[0];
  const [dx, dy] = dir;
  ctx.fillStyle = '#0d0f1a';
  [-1, 1].forEach(s => {
    const ex = (hx + .5 + dx * 0.18 - dy * 0.2 * s) * cell;
    const ey = (hy + .5 + dy * 0.18 + dx * 0.2 * s) * cell;
    ctx.beginPath(); ctx.arc(ex, ey, cell * 0.08, 0, 7); ctx.fill();
  });

  // частицы
  particles.forEach(p => {
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x * cell, p.y * cell, cell * 0.08, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function mix(c1, c2, t) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = s => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

// ---------- цикл ----------
let last = 0, acc = 0;
function loop(time) {
  const dt = Math.min(100, time - last); last = time;
  if (state === 'play') {
    acc += dt;
    while (acc >= speed && state === 'play') { acc -= speed; step(); }
  }
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.03; });
  particles = particles.filter(p => p.life > 0);
  draw(time);
  requestAnimationFrame(loop);
}

// ---------- управление ----------
function turn(v) {
  const lastDir = queue.length ? queue[queue.length - 1] : dir;
  if (v[0] === -lastDir[0] && v[1] === -lastDir[1]) return; // разворот запрещён
  if (v[0] === lastDir[0] && v[1] === lastDir[1]) return;
  if (queue.length < 3) queue.push(v);
}

function showOverlay(title, text, btn) {
  $('ovTitle').textContent = title;
  $('ovText').textContent = text;
  $('ovBtn').textContent = btn;
  $('overlay').classList.remove('hidden');
}
function start() {
  if (state === 'over' || state === 'ready') reset();
  state = 'play'; acc = 0;
  $('overlay').classList.add('hidden');
}
function togglePause() {
  if (state === 'play') { state = 'pause'; showOverlay('Пауза', 'Нажми пробел или кликни, чтобы продолжить', 'Продолжить'); }
  else start();
}

document.addEventListener('keydown', e => {
  if (DIRS[e.code]) {
    e.preventDefault();
    if (state !== 'play') start();
    turn(DIRS[e.code]);
  } else if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.code === 'KeyR') { state = 'over'; start(); }
});
$('overlay').addEventListener('click', start);

let touch = null;
canvas.addEventListener('touchstart', e => { const t = e.touches[0]; touch = [t.clientX, t.clientY]; }, { passive: true });
canvas.addEventListener('touchend', e => {
  if (!touch) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touch[0], dy = t.clientY - touch[1];
  touch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  turn(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]);
});

state = 'ready';
reset();
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
